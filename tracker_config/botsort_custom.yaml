# BoT-SORT Custom Configuration for MI-EYE PRO
# ──────────────────────────────────────────────
#
# WHY BoT-SORT OVER ByteTrack:
#   BoT-SORT adds a lightweight appearance re-identification (re-ID) model on
#   top of ByteTrack's Kalman filter.  When a person is occluded and reappears,
#   BoT-SORT matches them by appearance features, not just predicted position.
#
# TRACK_BUFFER (150):
#   Lost tracks survive 150 frames (~6 seconds at 24fps) before deletion.
#   Default is 30 — too short for classroom occlusions.

tracker_type: botsort

track_high_thresh: 0.4
track_low_thresh: 0.1
new_track_thresh: 0.5
track_buffer: 150
match_thresh: 0.8
fuse_score: true

# Camera Motion Compensation — disabled for fixed classroom camera
cmc_method: none

# Re-ID appearance model
with_reid: true
model: auto
proximity_thresh: 0.5
appearance_thresh: 0.25

# GMC method
gmc_method: sparseOptFlow
